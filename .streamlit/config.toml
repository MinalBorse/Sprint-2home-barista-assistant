# ==========================================================
# .streamlit/config.toml
# ==========================================================
# Streamlit's built-in theme settings: the base colours of the app.
# The extra café details (lamps, brick, chalkboard...) are added
# with CSS in src/theme.py.
# ==========================================================

[theme]
base = "dark"
primaryColor = "#D9A05B"               # warm brass (buttons, highlights)
backgroundColor = "#1B130E"            # dark espresso
secondaryBackgroundColor = "#2A1F18"   # dark wood
textColor = "#F3E6D3"                  # cream
font = "serif"
